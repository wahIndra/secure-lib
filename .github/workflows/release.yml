name: Release

# Push a tag such as v0.1.0 (see RELEASING.md). The tag is the single source of the version:
# the POMs and package.json keep a -SNAPSHOT / development version on main.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        name: Check tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Releases are cut from main only.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          echo "Releasing $VERSION from $GITHUB_SHA"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  maven-central:
    name: Publish to Maven Central
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml
          # Writes ~/.m2/settings.xml with <server id="central"> reading these env vars,
          # and imports the signing key into gpg.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check secrets
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          P: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          K: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$U" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$P" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$K" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see RELEASING.md)"; exit 1; fi

      - name: Set version
        working-directory: java
        run: >-
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.25.3:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Deploy (sign, upload, wait until published)
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        # Tests already passed in the ci job, on every supported JDK.
        run: mvn -B -ntp -Prelease -DskipTests deploy

      - name: Keep the CLI jar for the GitHub release
        uses: actions/upload-artifact@v7
        with:
          name: cli-jar
          path: java/secure-core/target/secure-core-${{ env.VERSION }}.jar
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # npm provenance: links the published package to this workflow run
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check secrets
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: '[ -n "$T" ] || { echo "::error::Missing repository secret NPM_TOKEN (see RELEASING.md)"; exit 1; }'

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  github-release:
    name: GitHub release
    needs: [version, maven-central, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: cli-jar

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Maven Central**

          \`\`\`xml
          <dependency>
            <groupId>io.github.wahindra</groupId>
            <artifactId>secure-servlet-jakarta</artifactId> <!-- or secure-servlet-javax / secure-core -->
            <version>${VERSION}</version>
          </dependency>
          \`\`\`

          **npm**: \`npm install @wahindra/secure@${VERSION}\`

          **CLI**: \`java -jar secure-core-${VERSION}.jar scan src/\` (attached below, Java 8+).
          EOF
          gh release create "$GITHUB_REF_NAME" "secure-core-${VERSION}.jar" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
