name: Release

# Push a tag such as v0.1.0 (see RELEASING.md). The tag is the single source of the version:
# the POMs keep a -SNAPSHOT version and package.json a development version on main.
#
# "Run workflow" (workflow_dispatch) re-publishes an existing tag, e.g. to finish a release where
# one registry failed. The code is always built from the tag; only this workflow file comes from
# the branch it is started on. Maven Central and npm never accept the same version twice, so turn
# off whichever registry already has it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
      maven:
        description: "Publish to Maven Central (off if this version is already there)"
        type: boolean
        default: true
      npm:
        description: "Publish to npm (off if this version is already there)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      # The exact commit that was checked. Every later job checks out this SHA, never the tag
      # name, so a branch named like the tag or a tag moved mid-run cannot change what is built.
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - id: v
        name: Check tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vX.Y.Z."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi
          # Releases are cut from main only.
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main."
            exit 1
          fi
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::Checked-out commit does not match tag $TAG ($SHA)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v} from $SHA"

  ci:
    name: CI
    needs: version
    # A tag push runs the full suite. A manual re-publish uses a tag whose push already passed it.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  maven-central:
    name: Publish to Maven Central
    needs: [version, ci]
    if: >-
      !cancelled() && needs.version.result == 'success'
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
      && (github.event_name == 'push' || inputs.maven)
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Verify commit
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml
          # Writes ~/.m2/settings.xml with <server id="central"> reading these env vars,
          # and imports the signing key into gpg.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check secrets
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          P: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          K: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$U" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$P" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$K" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see RELEASING.md)"; exit 1; fi

      - name: Set version
        working-directory: java
        run: >-
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.25.3:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Deploy (sign, upload, wait until published)
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        # Tests already passed in the ci job, on every supported JDK.
        run: mvn -B -ntp -Prelease -DskipTests deploy

  npm:
    name: Publish to npm
    needs: [version, ci]
    if: >-
      !cancelled() && needs.version.result == 'success'
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
      && (github.event_name == 'push' || inputs.npm)
    runs-on: ubuntu-latest
    # Must match the environment configured as the trusted publisher on npmjs.com.
    environment: release
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this run's OIDC token for a short-lived publish
      # credential. No npm token is stored anywhere; provenance is attached automatically.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Verify commit
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }'

      # No registry-url: that would write an .npmrc with a token placeholder. npm publishes to
      # registry.npmjs.org by default and authenticates through OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check npm supports trusted publishing (11.5.1+)
        run: |
          v=$(npm -v)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$v" \
            || { echo "::error::npm $v is too old for trusted publishing (needs 11.5.1+)"; exit 1; }
          echo "npm $v"

      - name: Set version
        # --allow-same-version: package.json may already carry the release version.
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public

  github-release:
    name: GitHub release
    needs: [version, maven-central, npm]
    # Runs when every publish job that was asked for succeeded.
    if: >-
      !cancelled() && needs.version.result == 'success'
      && (needs.maven-central.result == 'success' || needs.maven-central.result == 'skipped')
      && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Verify commit
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }'

      # Taking the jar from Maven Central (not from this run's build) also proves it is published.
      - name: Download the CLI jar from Maven Central
        run: |
          URL="https://repo1.maven.org/maven2/io/github/wahindra/secure-core/${VERSION}/secure-core-${VERSION}.jar"
          for i in $(seq 1 60); do
            if curl -fsSL -o "secure-core-${VERSION}.jar" "$URL"; then
              echo "downloaded $URL"; exit 0
            fi
            echo "not on Maven Central yet (attempt $i/60), waiting 30 s"; sleep 30
          done
          echo "::error::secure-core ${VERSION} did not appear on Maven Central within 30 minutes."
          exit 1

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Maven Central**

          \`\`\`xml
          <dependency>
            <groupId>io.github.wahindra</groupId>
            <artifactId>secure-servlet-jakarta</artifactId> <!-- or secure-servlet-javax / secure-core -->
            <version>${VERSION}</version>
          </dependency>
          \`\`\`

          **npm**: \`npm install @wahindra/secure@${VERSION}\`

          **CLI**: \`java -jar secure-core-${VERSION}.jar scan src/\` (attached below, Java 8+).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "secure-core-${VERSION}.jar" --clobber
          else
            gh release create "$TAG" "secure-core-${VERSION}.jar" \
              --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
